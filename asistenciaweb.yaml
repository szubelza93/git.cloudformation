AWSTemplateFormatVersion: "2010-09-09"
Description: Infraestructura de AsistenciaWeb convertida desde Terraform (VPC, Subred, SGs, KeyPair y EC2)

Parameters:
  AwsRegion:
    Type: String
    Default: "us-east-2"
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
  PublicSubnetCidr:
    Type: String
    Default: "10.0.1.0/24"
  MyIpCidr:
    Type: String
    Default: "166.114.174.35/32"
  KeyName:
    Type: String
    Default: "asistenciaweb-key"
  InstanceType:
    Type: String
    Default: "t3.micro"

Resources:
  # 1. PAR DE CLAVES AUTOMÁTICO
  # Equivalente al recurso tls_private_key y aws_key_pair de Terraform. 
  # CloudFormation genera la llave y almacena la parte privada de forma segura en el SSM Parameter Store.
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref KeyName
      KeyType: rsa

  # 3. RED (VPC, SUBNET, IGW Y ROUTE TABLE)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "asistenciaweb-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "asistenciaweb-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Sub "${AwsRegion}a"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: "asistenciaweb-subnet-publica"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "asistenciaweb-route-table"

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # 4. SEGURIDAD (SECURITY GROUPS)
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Acceso SSH, HTTP y HTTPS al frontend"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
          Description: "SSH desde IP autorizada"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: "HTTP publico"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: "HTTPS publico"
      Tags:
        - Key: Name
          Value: "asistenciaweb-frontend-sg"

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Acceso SSH y comunicacion desde el frontend"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
          Description: "SSH desde IP autorizada"
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
          Description: "Comunicacion desde frontend"
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: "0.0.0.0/0"
          Description: "Acceso publico al backend"
      Tags:
        - Key: Name
          Value: "asistenciaweb-backend-sg"

  # 6. INSTANCIAS EC2 (FRONTEND Y BACKEND)
  # Se utiliza un parámetro SSM nativo de AWS para consultar dinámicamente la última AMI de Ubuntu 24.04 LTS (equivalente al data source de Terraform).
  FrontendInstance:
    Type: AWS::EC2::Instance
    DependsOn: 
      - DefaultPublicRoute
      - KeyPair
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: 
        - !Ref FrontendSecurityGroup
      AssociatePublicIpAddress: true
      KeyName: !Ref KeyName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: "asistenciaweb-frontend"

  BackendInstance:
    Type: AWS::EC2::Instance
    DependsOn: 
      - DefaultPublicRoute
      - KeyPair
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: 
        - !Ref BackendSecurityGroup
      AssociatePublicIpAddress: true
      KeyName: !Ref KeyName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: "asistenciaweb-backend"

Outputs:
  FrontendPublicIp:
    Description: "IP publica del frontend"
    Value: !GetAtt FrontendInstance.PublicIp

  FrontendUrl:
    Description: "Direccion HTTP del frontend"
    Value: !Sub "http://${FrontendInstance.PublicIp}"

  BackendPublicIp:
    Description: "IP publica del backend"
    Value: !GetAtt BackendInstance.PublicIp

  BackendPrivateIp:
    Description: "IP privada del backend"
    Value: !GetAtt BackendInstance.PrivateIp